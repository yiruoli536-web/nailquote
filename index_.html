<script>
(function(){
  var c=document.createElement('canvas');
  c.width=180;c.height=180;
  var ctx=c.getContext('2d');
  // Background
  ctx.fillStyle='#F5EDE8';
  var r=40;
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(180-r,0);ctx.quadraticCurveTo(180,0,180,r);
  ctx.lineTo(180,180-r);ctx.quadraticCurveTo(180,180,180-r,180);
  ctx.lineTo(r,180);ctx.quadraticCurveTo(0,180,0,180-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();ctx.fill();
  // Nail shape outline
  ctx.strokeStyle='#C4927A';ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(58,140);ctx.lineTo(58,80);
  ctx.quadraticCurveTo(58,36,90,36);
  ctx.quadraticCurveTo(122,36,122,80);
  ctx.lineTo(122,140);ctx.closePath();ctx.stroke();
  // Nail top fill
  ctx.fillStyle='#E8C4B0';ctx.globalAlpha=0.5;
  ctx.beginPath();
  ctx.moveTo(58,90);ctx.lineTo(58,80);
  ctx.quadraticCurveTo(58,36,90,36);
  ctx.quadraticCurveTo(122,36,122,80);
  ctx.lineTo(122,90);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
  // Dots
  ctx.fillStyle='#C4927A';ctx.globalAlpha=0.6;
  ctx.beginPath();ctx.arc(130,55,6,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.4;
  ctx.beginPath();ctx.arc(138,78,4,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.5;
  ctx.beginPath();ctx.arc(132,100,5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  // NQ text
  ctx.fillStyle='#9A6B54';ctx.font='500 22px sans-serif';
  ctx.textAlign='center';ctx.letterSpacing='4px';
  ctx.fillText('NQ',90,158);
  var dataUrl=c.toDataURL('image/png');
  document.getElementById('app-icon').href=dataUrl;
})();
</script>

function renderUpload() {
  var paintSubs = ['\u7c21\u55ae\u624b\u7e6a', '\u4e2d\u7b49\u624b\u7e6a', '\u7cbe\u7d30\u624b\u7e6a'];

  var complexOpts = ['\u7c21\u55ae', '\u4e2d\u7b49', '\u7cbe\u7d30'];

  var imgContent = imgBase64
    ? '<img src="data:' + imgMime + ';base64,' + imgBase64 + '" class="upload-preview">'
    : '<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><p>\u9ede\u6b64\u62cd\u7167\u6216\u4e0a\u50b3\u6210\u54c1\u5716</p><small>AI \u81ea\u52d5\u8b58\u5225\u6307\u7532\u9577\u5ea6</small>';

  var paintHTML = '';
  if (decoType === 'handpaint') {
    paintHTML = '<div class="sec-label">\u624b\u7e6a\u8907\u96dc\u5ea6</div><div class="pill-row">';
    for (var i = 0; i < paintSubs.length; i++) {
      var s = paintSubs[i];
      paintHTML += '<span class="pill' + (paintLevel === s ? ' sel-p' : '') + '" onclick="selPaint(\'' + s + '\')">' + s + '<br><small style="font-size:10px;opacity:.7">+NT$' + settings.paint[s] + '</small></span>';
    }
    paintHTML += '</div>';
  }

  var stickerHTML = '';
  if (decoType === 'sticker') {
    stickerHTML = '<div class="sec-label">\u8cbc\u7d19\u985e\u578b</div><div class="pill-row">';
    for (var i = 0; i < stickerSubs.length; i++) {
      var s = stickerSubs[i];
      stickerHTML += '<span class="pill' + (stickerLevel === s ? ' sel-k' : '') + '" onclick="selSticker(\'' + s + '\')">' + s + '<br><small style="font-size:10px;opacity:.7">+NT$' + settings.sticker[s] + '</small></span>';
    }
    stickerHTML += '</div>';
  }

  var complexHTML = '<div class="sec-label">\u8a2d\u8a08\u8907\u96dc\u5ea6</div><div class="pill-row">';
  for (var i = 0; i < complexOpts.length; i++) {
    var c = complexOpts[i];
    complexHTML += '<span class="pill' + (complexLevel === c ? ' sel-c' : '') + '" onclick="selComplex(\'' + c + '\')">' + c + '</span>';
  }
  complexHTML += '</div>';

  return '<div class="upload-zone" onclick="triggerUpload()">' + imgContent
    + '<input type="file" id="img-input" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)"></div>'
    + '<div class="sec-label">\u88dd\u98fe\u985e\u578b</div>'
    + '<div class="deco-grid">'
    + '<div class="deco-card' + (decoType === 'handpaint' ? ' sel-paint' : '') + '" onclick="selDeco(\'handpaint\')">'
    + '<div class="deco-card-icon">&#128396;&#65039;</div><div class="deco-card-name">\u624b\u7e6a</div><div class="deco-card-desc">\u4eba\u5de5\u5f69\u7e6a\u3001\u624b\u5de5\u5716\u6848</div></div>'
    + '<div class="deco-card' + (decoType === 'sticker' ? ' sel-sticker' : '') + '" onclick="selDeco(\'sticker\')">'
    + '<div class="deco-card-icon">&#10024;</div><div class="deco-card-name">\u8cbc\u7d19</div><div class="deco-card-desc">\u7f8e\u7532\u8cbc\u3001\u8f49\u5370\u8cbc\u7d19</div></div>'
    + '</div>'
    + paintHTML + stickerHTML + complexHTML
    + '<div class="sec-label">\u4f7f\u7528\u6750\u6599</div>'
    + '<input class="field-input" id="inp-materials" type="text" placeholder="\u4f8b\uff1a\u51dd\u81a0\u3001\u5f69\u7e6a\u3001\u6c34\u9e3d" value="\u51dd\u81a0 + \u6c34\u9e3d">'
    + '<div class="sec-label">\u5099\u8a3b\u7d66\u8001\u95c6</div>'
    + '<textarea class="field-input" id="inp-notes" rows="3" placeholder="\u5ba2\u4eba\u7279\u5225\u8981\u6c42..."></textarea>'
    + '<button class="btn btn-pink" onclick="startScan()">\u9001\u51fa\u4f30\u50f9\u8acb\u6c42</button>';
}

function renderScanning() {

function renderResult() {
  var b = aiBreak;

  var decoLabel = decoType === 'handpaint' ? paintLevel : decoType === 'sticker' ? stickerLevel : null;
  var decoClass = decoType === 'handpaint' ? 'hl' : 'hl-pink';
  var decoIcon = decoType === 'handpaint' ? '&#128396;&#65039;' : '&#10024;';

  var badgesHTML = '<span class="dbadge len">&#128207; AI\u8b58\u5225\uff1a' + lengthLevel + ' +NT$' + b.len + '</span>';
  if (decoLabel) badgesHTML += '<span class="dbadge ' + (decoType === 'handpaint' ? 'paint' : 'sticker') + '">' + decoIcon + ' ' + decoLabel + ' +NT$' + b.deco + '</span>';

  var decoRow = decoLabel ? '<div class="brow ' + decoClass + '"><span>' + decoIcon + ' ' + decoLabel + '</span><span class="bval">+NT$' + b.deco + '</span></div>' : '';
  var blingRow = b.bling > 0 ? '<div class="brow"><span>\u6c34\u9e3d\u88dd\u98fe</span><span class="bval">+NT$' + b.bling + '</span></div>' : '';

  return '<button class="back-btn" onclick="staffGoto(\'upload\')">' + IC.back + ' \u91cd\u65b0\u586b\u5beb</button>'
    + '<div class="price-hero"><div class="price-hero-label">AI \u5efa\u8b70\u552e\u50f9</div>'
    + '<div class="price-hero-num">NT$' + total.toLocaleString() + '</div>'
    + '<div class="price-hero-range">\u53c3\u8003\u5340\u9593 NT$' + (total - 100).toLocaleString() + '\u2013NT$' + (total + 120).toLocaleString() + '</div></div>'
    + '<div style="display:flex;flex-wrap:wrap;margin-bottom:14px">' + badgesHTML + '</div>'
    + '<div class="ai-box">' + IC.spark + ' ' + (aiReason || '\u4f9d\u8001\u95c6\u8a2d\u5b9a\u7684\u5b9a\u50f9\u908f\u8f2f\u8a08\u7b97\u5efa\u8b70\u552e\u50f9\u3002') + '</div>'
    + '<p class="sec-label">\u8cbb\u7528\u660e\u7d30</p>'
    + '<div class="breakdown">'
    + '<div class="brow"><span>\u57fa\u672c\u670d\u52d9\uff08' + complexLevel + '\u8907\u96dc\u5ea6\uff09</span><span class="bval">NT$' + b.base + '</span></div>'
    + '<div class="brow hl-teal"><span>&#128207; \u6307\u7532\u9577\u5ea6\uff08' + lengthLevel + '\uff09</span><span class="bval">+NT$' + b.len + '</span></div>'
    + decoRow + blingRow
    + '<div class="brow"><span>\u7e3d\u8a08</span><span class="bval">NT$' + total.toLocaleString() + '</span></div>'
    + '</div>'
    + '<button class="btn btn-outline" onclick="showToast(\'&#24050;\u544a\u77e5\u5ba2\u4eba\u5831\u50f9\uff01\')">\u5df2\u544a\u77e5\u5ba2\u4eba\u5831\u50f9</button>';
}

  for (var i = 0; i < myQuotes.length; i++) {
    var q = myQuotes[i];
    var statusBg = q.status === 'confirmed' ? 'var(--teal-lt)' : 'var(--amber-lt)';
    var statusColor = q.status === 'confirmed' ? '#1a8c74' : '#9a6800';

    var decoTag = q.deco_type ? '<span class="htag ' + (q.deco_type === 'handpaint' ? 'p' : 'k') + '">' + (q.deco_type === 'handpaint' ? '&#128396;&#65039;' : '&#10024;') + ' ' + (q.deco_level || '') + '</span>' : '';
    html += '<div class="hist-item">'
      + '<div class="hist-dot" style="background:var(--pink)"></div>'
      + '<div style="flex:1"><div class="hist-name">' + (q.service || '\u51dd\u81a0\u4f30\u50f9') + '</div>'

function renderReview() {
  var pending = allQuotes.filter(function(q) { return q.status === 'pending'; });
  if (!pending.length) return '<div class="card"><div class="card-title">\u5f85\u78ba\u8a8d\u4f30\u50f9</div><div class="card-sub">\u76ee\u524d\u6c92\u6709\u5f85\u78ba\u8a8d\u7684\u4f30\u50f9 &#127881;</div></div>';
  var html = '<div class="card"><div class="card-title">\u5f85\u78ba\u8a8d\u4f30\u50f9</div><div class="card-sub">AI \u5df2\u81ea\u52d5\u4f30\u50f9\uff0c\u78ba\u8a8d\u6216\u5fae\u8abf\u5f8c\u9001\u51fa</div></div>';
  for (var i = 0; i < pending.length; i++) {
    var q = pending[i];
    var decoTag = q.deco_type ? '<span class="ctag ' + (q.deco_type === 'handpaint' ? 'ctag-p' : 'ctag-k') + '">' + (q.deco_type === 'handpaint' ? '&#128396;&#65039;' : '&#10024;') + ' ' + (q.deco_level || '') + ' +NT$' + (q.deco_add || 0) + '</span>' : '';
    html += '<div class="conf-card">'
      + '<div class="conf-hd"><span class="conf-name">' + (q.staff_name || '\u5e6b\u624b') + ' \u00b7 ' + (q.service || '\u51dd\u81a0\u4f30\u50f9') + '</span><span class="conf-time">' + formatDate(q.created_at) + '</span></div>'
      + '<div class="conf-tags">' + decoTag
      + '<span class="ctag ctag-l">&#128207; ' + (q.length_level || '\u9577\u7532') + ' +NT$' + (q.length_add || 0) + '</span>'
      + '<span class="ctag ctag-c">' + (q.complex_level || '\u4e2d\u7b49') + '\u8907\u96dc\u5ea6</span></div>'
      + '<div class="conf-ai">&#10022; AI\uff1a' + (q.ai_reasoning || '\u4f9d\u5b9a\u50f9\u908f\u8f2f\u4f30\u50f9') + '</div>'
      + '<div class="conf-row"><input class="conf-input" type="number" value="' + (q.ai_price || 0) + '" id="price-' + q.id + '">'
      + '<button class="btn btn-purple btn-sm" onclick="confirmQuote(\'' + q.id + '\')">&#10003; \u78ba\u8a8d\u9001\u51fa</button></div>'
      + '</div>';
  }
  return html;
}

function renderBossHistory() {
  if (bHistView !== 'overview') return renderStaffDetail(bHistView);
  var confirmed = allQuotes.filter(function(q) { return q.status === 'confirmed'; });
  var grandTotal = confirmed.reduce(function(s, q) { return s + (q.final_price || 0); }, 0);
  var colors = ['#E8547A', '#7C5CBF', '#2BBFA0', '#F0A500'];
  var byStaff = {};
  var colorIdx = 0;
  for (var i = 0; i < allQuotes.length; i++) {
    var q = allQuotes[i];
    if (!byStaff[q.staff_id]) {
      byStaff[q.staff_id] = {name: q.staff_name || '\u5e6b\u624b', records: [], color: colors[colorIdx++ % colors.length]};
    }
    byStaff[q.staff_id].records.push(q);
  }
  var html = '<div class="stats-grid">'

async function doLogin() {
  var email = document.getElementById('inp-email').value.trim();
  var pass = document.getElementById('inp-pass').value.trim();
  var err = document.getElementById('login-err');
  var btn = document.getElementById('login-btn');
  if (!email || !pass) { err.style.display = 'block'; err.textContent = '\u8acb\u586b\u5beb\u5e33\u865f\u548c\u5bc6\u78bc'; return; }
  btn.textContent = '\u767b\u5165\u4e2d...'; btn.disabled = true;
  try {
    var result = await sb.auth.signInWithPassword({email: email, password: pass});
    if (result.error) throw result.error;
    var user = result.data.user;
    var role = user.user_metadata && user.user_metadata.role ? user.user_metadata.role : loginRole;
    if (role !== loginRole) {
      await sb.auth.signOut();
      err.style.display = 'block'; err.textContent = '\u6b64\u5e33\u865f\u4e0d\u662f' + (loginRole === 'staff' ? '\u5e6b\u624b' : '\u8001\u95c6') + '\u5e33\u865f';
      btn.textContent = '\u767b\u5165'; btn.disabled = false; return;
    }
    session = {id: user.id, email: user.email, name: role === 'boss' ? BOSS_NAME : (user.user_metadata && user.user_metadata.name ? user.user_metadata.name : email), role: role};
    loginRole = null;
    await loadData(); render();
  } catch(e) {
    err.style.display = 'block'; err.textContent = '\u5e33\u865f\u6216\u5bc6\u78bc\u932f\u8aa4\uff0c\u8acb\u518d\u8a66\u4e00\u6b21';
    btn.textContent = '\u767b\u5165'; btn.disabled = false;
  }
}

// AI SCAN
async function startScan() {
  sPage = 'scanning'; render();
  var materials = (document.getElementById('inp-materials') || {}).value || '\u51dd\u81a0';
  var notes = (document.getElementById('inp-notes') || {}).value || '';
  var deco = decoType === 'handpaint' ? '\u624b\u7e6a\uff08' + (paintLevel || '\u672a\u9078') + '\uff09'
    : decoType === 'sticker' ? '\u8cbc\u7d19\uff08' + (stickerLevel || '\u672a\u9078') + '\uff09' : '\u7121\u7279\u6b8a\u88dd\u98fe';
  var prompt = 'AI\u5c08\u696d\u7f8e\u7532\u4f30\u50f9\u52a9\u624b\u3002\u6839\u64da\u4ee5\u4e0b\u8cc7\u8a0a\u4f30\u50f9\u3002\n\u6750\u6599\uff1a' + materials + '\uff0c\u88dd\u98fe\uff1a' + deco + '\uff0c\u8907\u96dc\u5ea6\uff1a' + complexLevel + '\uff0c\u5099\u8a3b\uff1a' + (notes || '\u7121') + '\n'
    + '\u5b9a\u50f9\u898f\u5247\uff1a\u7c21\u55aeNT$' + settings.complex['\u7c21\u55ae'] + '\u4e2d\u7b49NT$' + settings.complex['\u4e2d\u7b49'] + '\u7cbe\u7d30NT$' + settings.complex['\u7cbe\u7d30'] + '\n'
    + '\u624b\u7e6a\uff1a\u7c21\u55ae+NT$' + settings.paint['\u7c21\u55ae\u624b\u7e6a'] + '\u4e2d\u7b49+NT$' + settings.paint['\u4e2d\u7b49\u624b\u7e6a'] + '\u7cbe\u7d30+NT$' + settings.paint['\u7cbe\u7d30\u624b\u7e6a'] + '\n'
    + '\u8cbc\u7d19\uff1a\u5c0f\u578b+NT$' + settings.sticker['\u5c0f\u578b\u8cbc\u7d19'] + '\u5927\u578b+NT$' + settings.sticker['\u5927\u578b\u8cbc\u7d19'] + '\u8907\u96dc+NT$' + settings.sticker['\u8907\u96dc\u62fc\u8cbc'] + '\n'
    + '\u9577\u5ea6\uff1a\u77ed\u7532+NT$' + settings.length['\u77ed\u7532'] + '\u4e2d\u7532+NT$' + settings.length['\u4e2d\u7532'] + '\u9577\u7532+NT$' + settings.length['\u9577\u7532'] + '\u8d85\u9577\u7532+NT$' + settings.length['\u8d85\u9577\u7532'] + '\n'
    + '\u53ea\u56deJSON\uff1a{"detectedLength":"\u77ed\u7532|\u4e2d\u7532|\u9577\u7532|\u8d85\u9577\u7532","complexityLevel":"\u7c21\u55ae|\u4e2d\u7b49|\u7cbe\u7d30","decoType":"handpaint|sticker|none","decoLevel":"\u540d\u7a31","basePrice":0,"lengthAdd":0,"decoAdd":0,"blingAdd":0,"totalPrice":0,"reasoning":"\u4e00\u53e5\u8a71"}';

  var parts = [{text: prompt}];
  if (imgBase64) parts.unshift({inline_data: {mime_type: imgMime, data: imgBase64}});

  try {
    var resp = await fetch(GEM_URL + '?key=' + GEM_KEY, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({contents: [{parts: parts}], generationConfig: {temperature: 0.2}})
    });
    var data = await resp.json();
    var raw = ((data.candidates || [])[0] || {content: {parts: [{text: '{}'}]}}).content.parts[0].text;
    var result = JSON.parse(raw.replace(/```json|```/g, '').trim());
    lengthLevel = result.detectedLength || lengthLevel;
    complexLevel = result.complexityLevel || complexLevel;
    if (result.decoType === 'handpaint') { decoType = 'handpaint'; paintLevel = result.decoLevel || paintLevel; }
    else if (result.decoType === 'sticker') { decoType = 'sticker'; stickerLevel = result.decoLevel || stickerLevel; }
    aiReason = result.reasoning || '';
    aiTotal = result.totalPrice || 0;
    aiBreak = {base: result.basePrice || settings.complex[complexLevel], len: result.lengthAdd || 0, deco: result.decoAdd || 0, bling: result.blingAdd || 0};
    await sb.from('quotes').insert({
      staff_id: session.id, staff_name: session.name, service: materials, notes: notes,
      complex_level: complexLevel, deco_type: decoType,
      deco_level: decoType === 'handpaint' ? paintLevel : stickerLevel,
      deco_add: aiBreak.deco, length_level: lengthLevel, length_add: aiBreak.len,
      ai_price: aiTotal, ai_reasoning: aiReason, status: 'pending'
    });
    await loadData();
  } catch(e) {
    console.error(e);
    aiReason = '(AI \u5206\u6790\u5931\u6557\uff0c\u4f7f\u7528\u9810\u8a2d\u4f30\u50f9)';
    aiTotal = settings.complex[complexLevel] + (settings.length[lengthLevel] || 0) + 100;
    aiBreak = {base: settings.complex[complexLevel], len: settings.length[lengthLevel] || 0, deco: 0, bling: 100};
  }
  sPage = 'result'; render();
}

// UTILS
function formatDate(iso, mode) {
  if (!iso) return '';
  var d = new Date(iso);
  var now = new Date();
  var diff = Math.floor((now - d) / 86400000);
  var timeStr = d.toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit'});
  if (mode === 'time') return timeStr;
  var dateStr = diff === 0 ? '\u4eca\u5929' : diff === 1 ? '\u6628\u5929' : diff + '\u5929\u524d';
  if (mode === 'date') return dateStr;
  return dateStr + ' ' + timeStr;
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerHTML = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2400);
}

    var user = result.data.session.user;
    var role = user.user_metadata && user.user_metadata.role ? user.user_metadata.role : 'staff';
    var name = role === 'boss' ? BOSS_NAME : (user.user_metadata && user.user_metadata.name ? user.user_metadata.name : user.email);
    session = {id: user.id, email: user.email, name: name, role: role};
    await loadData();
  }
  render();
}
init();
</script>
</body>
